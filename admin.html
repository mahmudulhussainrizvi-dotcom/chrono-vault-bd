<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">

<title>CHRONO VAULT BD — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  line-height:1.5;
}

button,
input,
select{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

/* HEADER */

header{
  background:#0b0b0b;
  border-bottom:1px solid #292929;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1200px;
  margin:auto;
  min-height:70px;
  padding:10px 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  border:1px solid #d4af37;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#d4af37;
  font-weight:bold;
}

.brand b{
  color:#d4af37;
  letter-spacing:2px;
  font-size:14px;
}

.logout{
  border:1px solid #d4af37;
  background:transparent;
  color:#d4af37;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

/* LOGIN */

.login-page{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:30px;
}

.login-box h1{
  text-align:center;
  color:#d4af37;
  margin-bottom:8px;
}

.login-box p{
  text-align:center;
  color:#999;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  color:#bbb;
  margin-bottom:6px;
  font-size:14px;
}

.form-group input{
  width:100%;
  padding:13px;
  background:#181818;
  border:1px solid #444;
  border-radius:8px;
  color:#fff;
  outline:none;
}

.form-group input:focus{
  border-color:#d4af37;
}

.login-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#080808;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.error{
  color:#ff7070;
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

/* DASHBOARD */

.dashboard{
  max-width:1200px;
  margin:auto;
  padding:30px 4% 60px;
}

.dashboard-title{
  margin-bottom:25px;
}

.dashboard-title h1{
  color:#d4af37;
  font-size:30px;
}

.dashboard-title p{
  color:#999;
  margin-top:5px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat{
  background:#111;
  border:1px solid #292929;
  border-radius:12px;
  padding:20px;
}

.stat strong{
  display:block;
  color:#999;
  font-size:13px;
  margin-bottom:8px;
}

.stat span{
  color:#d4af37;
  font-size:27px;
  font-weight:bold;
}

/* ORDERS */

.orders-box{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
}

.orders-header{
  padding:20px;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.orders-header h2{
  color:#d4af37;
}

.refresh-btn{
  border:1px solid #555;
  background:#181818;
  color:#fff;
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
}

.order-card{
  padding:20px;
  border-bottom:1px solid #292929;
}

.order-card:last-child{
  border-bottom:0;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}

.order-id{
  color:#d4af37;
  font-size:18px;
  font-weight:bold;
}

.order-date{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.status-select{
  background:#181818;
  color:#d4af37;
  border:1px solid #555;
  padding:8px;
  border-radius:7px;
  outline:none;
}

.customer{
  background:#181818;
  border-radius:9px;
  padding:15px;
  margin-bottom:12px;
}

.customer div{
  margin-bottom:6px;
}

.customer div:last-child{
  margin-bottom:0;
}

.customer strong{
  color:#999;
}

.customer span{
  color:#fff;
}

.items{
  background:#181818;
  border-radius:9px;
  padding:15px;
  margin-bottom:12px;
}

.items h3{
  color:#d4af37;
  font-size:15px;
  margin-bottom:10px;
}

.item-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #292929;
  font-size:14px;
}

.item-row:last-child{
  border-bottom:0;
}

.item-name{
  color:#ddd;
}

.item-price{
  color:#d4af37;
  white-space:nowrap;
}

.order-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.payment{
  color:#aaa;
  font-size:13px;
}

.total{
  color:#d4af37;
  font-size:22px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#888;
  padding:40px 20px;
}

.loading{
  text-align:center;
  color:#d4af37;
  padding:40px;
}

/* MOBILE */

@media(max-width:700px){

  .nav{
    min-height:64px;
  }

  .brand b{
    font-size:11px;
    letter-spacing:1.5px;
  }

  .logo{
    width:40px;
    height:40px;
  }

  .logout{
    padding:8px 11px;
    font-size:12px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stat{
    padding:15px;
  }

  .stat span{
    font-size:22px;
  }

  .dashboard-title h1{
    font-size:25px;
  }

  .orders-header{
    padding:15px;
  }

  .orders-header h2{
    font-size:20px;
  }

  .order-card{
    padding:15px;
  }

  .order-top{
    flex-direction:column;
  }

  .status-select{
    width:100%;
  }

  .order-bottom{
    align-items:flex-end;
  }

  .total{
    font-size:19px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="nav">

    <div class="brand">

      <div class="logo">
        CV
      </div>

      <b>
        CHRONO VAULT BD
      </b>

    </div>

    <button
      id="logoutButton"
      class="logout hidden"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<!-- LOGIN -->

<section
  id="loginPage"
  class="login-page"
>

  <div class="login-box">

    <h1>
      Admin Login
    </h1>

    <p>
      CHRONO VAULT BD
    </p>

    <div class="form-group">

      <label>
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Admin email"
        autocomplete="email"
      >

    </div>

    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Admin password"
        autocomplete="current-password"
      >

    </div>

    <button
      id="loginButton"
      class="login-btn"
      onclick="login()"
    >
      Login
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</section>


<!-- DASHBOARD -->

<section
  id="dashboard"
  class="dashboard hidden"
>

  <div class="dashboard-title">

    <h1>
      Admin Dashboard
    </h1>

    <p>
      Manage CHRONO VAULT BD orders
    </p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <strong>
        Total Orders
      </strong>

      <span id="totalOrders">
        0
      </span>

    </div>


    <div class="stat">

      <strong>
        Pending
      </strong>

      <span id="pendingOrders">
        0
      </span>

    </div>


    <div class="stat">

      <strong>
        Confirmed
      </strong>

      <span id="confirmedOrders">
        0
      </span>

    </div>


    <div class="stat">

      <strong>
        Delivered
      </strong>

      <span id="deliveredOrders">
        0
      </span>

    </div>

  </div>


  <!-- ORDERS -->

  <div class="orders-box">

    <div class="orders-header">

      <h2>
        📦 Orders
      </h2>

      <button
        class="refresh-btn"
        onclick="loadOrders()"
      >
        ↻ Refresh
      </button>

    </div>


    <div id="orders">

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </div>

</section>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://rufdvkelwzsmnuruvdko.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3j4Bs4rft9_w4r1j6uHo5w_fYLIJsNI";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================
   SAFE HTML
================================= */

function safe(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================
   LOGIN
================================= */

async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const errorBox =
    document.getElementById(
      "loginError"
    );

  const button =
    document.getElementById(
      "loginButton"
    );


  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Please enter email and password.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Logging in...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(error){

      throw error;

    }


    if(!data.user){

      throw new Error(
        "Login failed."
      );

    }


    /* ==========================
       CHECK ADMIN
    ========================== */

    const {
      data:adminData,
      error:adminError
    } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq(
          "user_id",
          data.user.id
        )
        .maybeSingle();


    if(adminError){

      await supabaseClient.auth.signOut();

      throw new Error(
        "Admin permission check failed."
      );

    }


    if(!adminData){

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not an admin."
      );

    }


    showDashboard();


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    errorBox.textContent =
      error.message ||
      "Login failed.";

  }


  button.disabled = false;

  button.textContent =
    "Login";

}


/* =================================
   SHOW DASHBOARD
================================= */

function showDashboard(){

  document.getElementById(
    "loginPage"
  ).classList.add("hidden");


  document.getElementById(
    "dashboard"
  ).classList.remove("hidden");


  document.getElementById(
    "logoutButton"
  ).classList.remove("hidden");


  loadOrders();

}


/* =================================
   CHECK EXISTING SESSION
================================= */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if(
    data &&
    data.session &&
    data.session.user
  ){

    const {
      data:adminData
    } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq(
          "user_id",
          data.session.user.id
        )
        .maybeSingle();


    if(adminData){

      showDashboard();

    }

  }

}


/* =================================
   LOGOUT
================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =================================
   LOAD ORDERS
================================= */

async function loadOrders(){

  const box =
    document.getElementById(
      "orders"
    );


  box.innerHTML = `

    <div class="loading">
      Loading orders...
    </div>

  `;


  try{

    const {
      data:orders,
      error
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    if(
      !Array.isArray(orders) ||
      orders.length === 0
    ){

      box.innerHTML = `

        <div class="empty">
          No orders yet.
        </div>

      `;

      updateStats([]);

      return;

    }


    updateStats(orders);


    box.innerHTML =
      orders.map(
        function(order){

          return renderOrder(order);

        }
      ).join("");


  }catch(error){

    console.error(
      "Orders error:",
      error
    );


    box.innerHTML = `

      <div class="empty">

        Could not load orders.

        <br><br>

        ${safe(error.message)}

      </div>

    `;

  }

}


/* =================================
   STATS
================================= */

function updateStats(orders){

  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    orders.filter(
      order =>
        String(order.status || "")
          .toLowerCase() === "pending"
    ).length;


  document.getElementById(
    "confirmedOrders"
  ).textContent =
    orders.filter(
      order =>
        String(order.status || "")
          .toLowerCase() === "confirmed"
    ).length;


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    orders.filter(
      order =>
        String(order.status || "")
          .toLowerCase() === "delivered"
    ).length;

}


/* =================================
   RENDER ORDER
================================= */

function renderOrder(order){

  let itemsHTML = "";


  let items = [];


  try{

    if(
      Array.isArray(order.items)
    ){

      items = order.items;

    }else if(
      typeof order.items === "string"
    ){

      items =
        JSON.parse(order.items);

    }

  }catch(error){

    console.error(
      "Items parse error:",
      error
    );

  }


  if(
    Array.isArray(items) &&
    items.length > 0
  ){

    itemsHTML =
      items.map(
        function(item){

          const subtotal =
            Number(item.subtotal) ||
            (
              Number(item.price) *
              Number(item.quantity)
            );


          return `

            <div class="item-row">

              <span class="item-name">

                ${safe(item.name)}

                ×

                ${Number(item.quantity) || 0}

              </span>

              <span class="item-price">

                ৳${subtotal.toLocaleString("en-BD")}

              </span>

            </div>

          `;

        }
      ).join("");

  }else{

    itemsHTML = `

      <div class="item-row">

        <span class="item-name">
          No item details
        </span>

      </div>

    `;

  }


  const date =
    order.created_at
      ? new Date(
          order.created_at
        ).toLocaleString(
          "en-BD"
        )
      : "";


  const status =
    order.status ||
    "Pending";


  return `

    <div class="order-card">

      <div class="order-top">

        <div>

          <div class="order-id">

            Order #${safe(order.id)}

          </div>

          <div class="order-date">

            ${safe(date)}

          </div>

        </div>


        <select
          class="status-select"
          onchange="updateOrderStatus(${Number(order.id)}, this.value)"
        >

          <option
            value="Pending"
            ${status === "Pending" ? "selected" : ""}
          >
            Pending
          </option>

          <option
            value="Confirmed"
            ${status === "Confirmed" ? "selected" : ""}
          >
            Confirmed
          </option>

          <option
            value="Delivered"
            ${status === "Delivered" ? "selected" : ""}
          >
            Delivered
          </option>

          <option
            value="Cancelled"
            ${status === "Cancelled" ? "selected" : ""}
          >
            Cancelled
          </option>

        </select>

      </div>


      <div class="customer">

        <div>

          <strong>
            Customer:
          </strong>

          <span>
            ${safe(order.customer_name)}
          </span>

        </div>


        <div>

          <strong>
            Phone:
          </strong>

          <span>
            ${safe(order.phone)}
          </span>

        </div>


        <div>

          <strong>
            Address:
          </strong>

          <span>
            ${safe(order.address)}
          </span>

        </div>

      </div>


      <div class="items">

        <h3>
          Ordered Products
        </h3>

        ${itemsHTML}

      </div>


      <div class="order-bottom">

        <div class="payment">

          💵 Cash on Delivery

        </div>

        <div class="total">

          ৳${Number(order.total || 0).toLocaleString("en-BD")}

        </div>

      </div>

    </div>

  `;

}


/* =================================
   UPDATE STATUS
================================= */

async function updateOrderStatus(
  orderId,
  newStatus
){

  try{

    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .update({
          status:newStatus
        })
        .eq(
          "id",
          orderId
        );


    if(error){

      throw error;

    }


    await loadOrders();


  }catch(error){

    console.error(
      "Status update error:",
      error
    );


    alert(
      "Could not update order status."
    );

    await loadOrders();

  }

}


/* =================================
   START
================================= */

checkSession();


/* =================================
   AUTH STATE
================================= */

supabaseClient.auth.onAuthStateChange(
  function(event,session){

    if(
      event === "SIGNED_OUT"
    ){

      document.getElementById(
        "dashboard"
      ).classList.add("hidden");

      document.getElementById(
        "logoutButton"
      ).classList.add("hidden");

      document.getElementById(
        "loginPage"
      ).classList.remove("hidden");

    }

  }
);

</script>

</body>
</html>
