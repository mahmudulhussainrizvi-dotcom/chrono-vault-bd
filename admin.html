<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHRONO VAULT BD — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0b0b0b;
  border-bottom:1px solid #d4af37;
  padding:16px 20px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border:1px solid #d4af37;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d4af37;
  font-size:22px;
  font-weight:bold;
}

.brand-text{
  color:#d4af37;
  font-weight:bold;
  letter-spacing:2px;
  font-size:16px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 60px;
}

h1{
  color:#d4af37;
  margin-bottom:8px;
}

.subtitle{
  color:#aaa;
  margin-bottom:25px;
}

/* LOGIN */

.login-box{
  max-width:420px;
  margin:60px auto;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:30px 22px;
}

.login-box h2{
  color:#d4af37;
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #444;
  background:#080808;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#d4af37;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.gold-btn{
  width:100%;
  background:#d4af37;
  color:#080808;
}

.gold-btn:hover{
  opacity:.9;
}

.logout-btn{
  background:#181818;
  color:#d4af37;
  border:1px solid #d4af37;
}

/* ADMIN */

#adminPanel{
  display:none;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.refresh-btn{
  background:#d4af37;
  color:#080808;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:20px;
}

.stat-card span{
  display:block;
  color:#999;
  font-size:14px;
  margin-bottom:8px;
}

.stat-card strong{
  color:#d4af37;
  font-size:26px;
}

.orders{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.order-card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.order-id{
  color:#d4af37;
  font-size:18px;
  font-weight:bold;
}

.date{
  color:#888;
  font-size:13px;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:18px;
}

.info-box{
  background:#0b0b0b;
  border-radius:10px;
  padding:13px;
}

.info-box small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

.info-box div{
  color:#eee;
  word-break:break-word;
}

.items{
  border-top:1px solid #292929;
  padding-top:15px;
  margin-top:10px;
}

.items h3{
  color:#d4af37;
  font-size:16px;
  margin-bottom:10px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #222;
}

.item-name{
  color:#eee;
}

.item-price{
  color:#d4af37;
  white-space:nowrap;
}

.total{
  text-align:right;
  margin-top:15px;
  color:#d4af37;
  font-size:21px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:50px 20px;
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  color:#999;
}

.error{
  color:#ff7070;
  font-size:14px;
  margin-top:10px;
  text-align:center;
}

.success{
  color:#75d98b;
  font-size:14px;
  margin-top:10px;
  text-align:center;
}

.loading{
  text-align:center;
  color:#d4af37;
  padding:40px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:13px 14px;
  }

  .logo{
    width:42px;
    height:42px;
    font-size:19px;
  }

  .brand-text{
    font-size:13px;
    letter-spacing:1.5px;
  }

  .container{
    padding:22px 13px 50px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }

  .order-card{
    padding:16px;
  }

  .item{
    flex-direction:column;
  }

  .top-actions{
    align-items:stretch;
  }

  .refresh-btn,
  .logout-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="logo">CV</div>
      <div class="brand-text">CHRONO VAULT BD</div>
    </div>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>
</header>


<!-- LOGIN -->

<section id="loginSection">

  <div class="login-box">

    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="gold-btn" onclick="login()">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>

</section>


<!-- ADMIN PANEL -->

<section id="adminPanel">

  <div class="container">

    <div class="top-actions">

      <div>
        <h1>Admin Dashboard</h1>
        <div class="subtitle">
          CHRONO VAULT BD — Order Management
        </div>
      </div>

      <button class="refresh-btn" onclick="loadOrders()">
        ↻ Refresh Orders
      </button>

    </div>


    <div class="stats">

      <div class="stat-card">
        <span>Total Orders</span>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Pending Orders</span>
        <strong id="pendingOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Total Sales</span>
        <strong id="totalSales">৳0</strong>
      </div>

    </div>


    <div id="orders" class="orders">

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </div>

</section>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
  "https://rufdvkelwzsmnuruvdko.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3j4Bs4rft9_w4r1j6uHo5w_fYLIJsNI";


/* ================================
   LOGIN
================================ */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.innerHTML =
      '<div class="error">Email and password required.</div>';

    return;
  }

  message.innerHTML =
    '<div class="loading">Logging in...</div>';


  try{

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      throw new Error(
        data.msg ||
        data.error_description ||
        "Login failed"
      );

    }


    localStorage.setItem(
      "chronoAdminSession",
      JSON.stringify(data)
    );


    showAdmin();

  }catch(error){

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

  }

}


/* ================================
   SHOW ADMIN
================================ */

function showAdmin(){

  document.getElementById("loginSection").style.display =
    "none";

  document.getElementById("adminPanel").style.display =
    "block";

  loadOrders();

}


/* ================================
   LOAD ORDERS
================================ */

async function loadOrders(){

  const ordersBox =
    document.getElementById("orders");

  const session =
    JSON.parse(
      localStorage.getItem("chronoAdminSession") || "null"
    );


  if(!session || !session.access_token){

    showLogin();

    return;
  }


  ordersBox.innerHTML =
    '<div class="loading">Loading orders...</div>';


  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders?select=*&order=created_at.desc",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + session.access_token
        }
      }
    );


    const data = await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error_description ||
        "Could not load orders"
      );

    }


    renderOrders(data);


  }catch(error){

    ordersBox.innerHTML =
      '<div class="empty">' +
      '<div style="color:#ff7070;margin-bottom:10px;">' +
      'Could not load orders' +
      '</div>' +
      error.message +
      '</div>';

  }

}


/* ================================
   RENDER ORDERS
================================ */

function renderOrders(orders){

  const ordersBox =
    document.getElementById("orders");


  document.getElementById("totalOrders").textContent =
    orders.length;


  const pending =
    orders.filter(
      order =>
        String(order.status || "").toLowerCase()
        === "pending"
    ).length;


  document.getElementById("pendingOrders").textContent =
    pending;


  const sales =
    orders.reduce(
      (sum,order) =>
        sum + Number(order.total || 0),
      0
    );


  document.getElementById("totalSales").textContent =
    "৳" + sales.toLocaleString();


  if(!orders.length){

    ordersBox.innerHTML =
      '<div class="empty">' +
      'No orders received yet.' +
      '</div>';

    return;
  }


  ordersBox.innerHTML =
    orders.map(order => {

      let items = [];

      try{

        items =
          typeof order.items === "string"
          ? JSON.parse(order.items)
          : (order.items || []);

      }catch(e){

        items = [];

      }


      const created =
        order.created_at
        ? new Date(order.created_at)
            .toLocaleString("en-BD")
        : "—";


      const itemHTML =
        items.length

        ? items.map(item => {

            const name =
              item.Name ||
              item.name ||
              "Product";

            const qty =
              Number(
                item.quantity ||
                item.qty ||
                1
              );

            const price =
              Number(
                item.Price ||
                item.price ||
                0
              );


            return `
              <div class="item">

                <div class="item-name">
                  ${escapeHTML(name)}
                  × ${qty}
                </div>

                <div class="item-price">
                  ৳${(price * qty).toLocaleString()}
                </div>

              </div>
            `;

          }).join("")

        : `
          <div style="color:#888;">
            Order item details unavailable.
          </div>
        `;


      return `

        <div class="order-card">

          <div class="order-head">

            <div>
              <div class="order-id">
                Order #${order.id}
              </div>

              <div class="date">
                ${created}
              </div>
            </div>

            <div style="color:#d4af37;">
              ${escapeHTML(order.status || "Pending")}
            </div>

          </div>


          <div class="info">

            <div class="info-box">

              <small>Customer Name</small>

              <div>
                ${escapeHTML(order.customer_name)}
              </div>

            </div>


            <div class="info-box">

              <small>Phone</small>

              <div>
                ${escapeHTML(order.phone)}
              </div>

            </div>


            <div class="info-box">

              <small>Delivery Address</small>

              <div>
                ${escapeHTML(order.address)}
              </div>

            </div>


            <div class="info-box">

              <small>Payment</small>

              <div>
                Cash on Delivery
              </div>

            </div>

          </div>


          <div class="items">

            <h3>Ordered Products</h3>

            ${itemHTML}

          </div>


          <div class="total">

            Total: ৳${Number(
              order.total || 0
            ).toLocaleString()}

          </div>

        </div>

      `;

    }).join("");

}


/* ================================
   LOGOUT
================================ */

function logout(){

  localStorage.removeItem(
    "chronoAdminSession"
  );

  showLogin();

}


/* ================================
   SHOW LOGIN
================================ */

function showLogin(){

  document.getElementById("loginSection").style.display =
    "block";

  document.getElementById("adminPanel").style.display =
    "none";

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   AUTO LOGIN
================================ */

const savedSession =
  localStorage.getItem(
    "chronoAdminSession"
  );


if(savedSession){

  try{

    const session =
      JSON.parse(savedSession);

    if(session.access_token){

      showAdmin();

    }

  }catch(e){

    localStorage.removeItem(
      "chronoAdminSession"
    );

  }

}

</script>

</body>
</html>
